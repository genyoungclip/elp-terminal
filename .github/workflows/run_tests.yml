name: Android Build & Tests

on:
  push:
    branches:
      - master
      - main
      - 'github-releases/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify Android toolchain
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "Java:"
          java -version

          echo "SDK packages:"
          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-36|build-tools;36.0.0|ndk;29.0.14206865' || true

          echo "NDK:"
          cat "$ANDROID_HOME/ndk/29.0.14206865/source.properties"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find generated APKs
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: elp-terminal-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
