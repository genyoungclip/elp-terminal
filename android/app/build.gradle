apply plugin: 'com.android.application'

android {
    namespace = "net.elparadisogonzalo.elp"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "net.elparadisogonzalo.elp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Production signing configuration
            signingConfig signingConfigs.release

            // Release artifact naming
            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    outputFileName = "elp-terminal-${variant.versionName}-release.apk"
                }
            }
        }
        debug {
            debuggable true
            minifyEnabled false

            // Debug artifact naming
            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    outputFileName = "elp-terminal-${variant.versionName}-debug.apk"
                }
            }
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Production lint options
    lintOptions {
        checkReleaseBuilds true
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
        warningOnly 'MissingDimensionProductFlavor'
    }

    // Signing configuration (requires gradle.properties with RELEASE_STORE_FILE, etc.)
    signingConfigs {
        release {
            storeFile file(System.getenv('RELEASE_STORE_FILE') ?: 'release.jks')
            storePassword System.getenv('RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('RELEASE_KEY_ALIAS')
            keyPassword System.getenv('RELEASE_KEY_PASSWORD')
        }
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // Testing dependencies - excluded from release builds
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

// Google Play Services plugin - optional, safe if missing
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found - Google Play Services not configured")
}
